org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2
org.gradle.daemon=true
android.useAndroidX=true
# Use explicit Kotlin Android plugin so app MainActivity.kt is compiled into the APK.
android.builtInKotlin=false
android.newDsl=true
kotlin.incremental=false
# Plugins like flutter_webrtc still declare Java 1.8; keep builds unblocked if a plugin drifts.
kotlin.jvm.target.validation.mode=warning
